spring.application.name=lvalue
# football-api
api.rapidapi.key=${API_FOOTBALL_KEY:}
api.rapidapi.host=https://v3.football.api-sports.io
# Azure MySQL Server
spring.profiles.active=local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# ??? ????? ?? ?? ??
spring.jpa.properties.hibernate.format_sql=true
# Hibernate? ???? SQL? ???? ? ?? (6.x ??)
spring.jpa.properties.hibernate.show_bind_parameters=true
# JPA?? ?? ?? ? ?? ??? DEBUG? ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------------------------------------------------------- live data (free, ESPN based)
live.enabled=true
live.poll-interval-ms=60000
live.sync-cron=0 0 5 * * *
live.sync-on-startup=true
live.sync-past-days=3
live.sync-future-days=45
live.live-window-before-min=15
live.live-window-after-min=180
live.espn.base-url=https://site.api.espn.com
# 내부 리그 ID(api-football 기준) ↔ ESPN slug
live.leagues[0].id=39
live.leagues[0].name=Premier League
live.leagues[0].espn-slug=eng.1
live.leagues[1].id=140
live.leagues[1].name=La Liga
live.leagues[1].espn-slug=esp.1
live.leagues[2].id=78
live.leagues[2].name=Bundesliga
live.leagues[2].espn-slug=ger.1
live.leagues[3].id=61
live.leagues[3].name=Ligue 1
live.leagues[3].espn-slug=fra.1
# 추가 예시: Serie A(135)=ita.1, Champions League(2)=uefa.champions
# 자동 이름 매칭이 실패하는 팀 보정 (내부 team.name = ESPN displayName)
live.team-aliases[Wolves]=Wolverhampton Wanderers
live.team-aliases[Brighton]=Brighton & Hove Albion
live.team-aliases[Paris Saint Germain]=Paris Saint-Germain
live.team-aliases[Stade Brestois 29]=Brest
live.team-aliases[FC Koln]=1. FC Köln
live.team-aliases[Union Berlin]=1. FC Union Berlin
live.team-aliases[FC Heidenheim]=1. FC Heidenheim 1846
live.team-aliases[Athletic Club]=Athletic Club
live.team-aliases[Alaves]=Alavés

# 레거시 API-Football 배치 (유료 플랜 전환 시 true)
batch.api-football.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
