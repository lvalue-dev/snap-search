# ---------------------------------------------------------------------------
# demo 프로필: 외부 의존 없이 로컬에서 "눌러보기" 위한 설정
#   java -jar app.jar --spring.profiles.active=demo   (또는 scripts/demo.sh)
#   - H2 인메모리 DB (MySQL 호환 모드) + data-demo.sql 시드
#   - ESPN 대신 tools/mock-espn 가짜 서버(localhost:8099) 를 바라봄
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:snap;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql
spring.h2.console.enabled=true
spring.h2.console.path=/h2

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.snap_search=INFO

# Azure 는 사용하지 않음 (빈 생성용 더미 값)
azure.storage.connection-string=UseDevelopmentStorage=true
azure.storage.container-name=demo
batch.images.enabled=false
batch.api-football.enabled=false

# 가짜 ESPN
live.espn.base-url=${MOCK_ESPN_URL:http://localhost:8099}
live.poll-interval-ms=5000
live.sync-on-startup=true
live.sync-past-days=7
live.sync-future-days=14
